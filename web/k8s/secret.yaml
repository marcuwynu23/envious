# Fill with real secrets before applying (stringData shown for clarity;
# prefer sealed-secrets / external-secrets in production).
#   kubectl create secret generic envious-secrets \
#     --namespace envious \
#     --from-literal=ENCRYPTION_KEY="$(openssl rand -hex 32)" \
#     --from-literal=DATABASE_URL="" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: envious-secrets
  namespace: envious
type: Opaque
stringData:
  # Required in production: value encryption + session signing.
  ENCRYPTION_KEY: "change-me-to-32-plus-random-bytes"
  # Empty = sqlite. For postgres:
  # postgres://USER:PASSWORD@postgres:5432/envious?sslmode=require
  DATABASE_URL: ""
