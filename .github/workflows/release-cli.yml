name: Release CLI

# Builds version-stamped CLI binaries for Linux, macOS, and Windows
# on every version tag (v*) and attaches them to a GitHub Release.
# Manual runs (workflow_dispatch) build but do not publish a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to create GitHub Releases and upload assets

env:
  GO_VERSION: "1.23"

jobs:
  test:
    name: Vet and test (cli)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.sum
      - run: go vet ./...
      - run: go test ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for git describe version stamping
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.sum
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo none)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          AUTHOR="${GITHUB_REPOSITORY_OWNER:-unknown}"
          mkdir -p dist
          OUT="dist/envious-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          go build -trimpath \
            -ldflags "-X envious-cli/cmd.Version=${VERSION} -X envious-cli/cmd.Commit=${COMMIT} -X envious-cli/cmd.BuildDate=${BUILD_DATE} -X envious-cli/cmd.Author=${AUTHOR}" \
            -o "${OUT}" .
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: envious-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cli/dist/envious-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # Only publish on tag pushes; manual dispatches stop after build.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
